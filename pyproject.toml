[project]
name = "bankingbench"
version = "0.1.0"
description = "Private draft: synthetic payment tasks and adversarial verifier audit"
requires-python = ">=3.12"
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["harness/tests"]
addopts = "--import-mode=importlib -p no:cacheprovider"
norecursedirs = ["fixtures", ".git", "dist", "results"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["F", "E9"]
