id = "08_refund_limits"
title = "Limit refunds to the captured amount"
mandatory = false
difficulty = "medium"
tags = ["refunds"]
requires = []
timeout_seconds = 90
public_interface = ["refunds.service:RefundService, RefundExceedsCaptured, PaymentNotCaptured, InvalidAmount"]
leak_terms = ["BEGIN IMMEDIATE"]
[variants.reference]
kind = "reference"
[variants.alt_valid]
