<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title><!--__page_title__--></title><meta name="description" content="<!--__summary__-->">
<link rel="stylesheet" href="../assets/shared.css"></head>
<body class="task-page">
<a class="skip" href="#task">{{task_page.skip}}</a>
<nav class="top" aria-label="{{nav.primary}}"><div class="wrap"><a class="brand" href="../index.html"><i aria-hidden="true"></i><span>{{page.site_name}}</span></a><a class="btn ghost" href="../index.html#tasks">{{nav.tasks}}</a></div></nav>
<main class="wrap" id="task">
<div class="breadcrumb"><a href="../index.html#tasks">{{task_page.breadcrumb}}</a><span aria-hidden="true"> / </span><span><!--__number__--></span></div>
<header class="task-hero"><p class="eyebrow"><!--__number__--> · <!--__area__--></p><h1><!--__title__--></h1><p class="lede"><!--__summary__--></p><div class="tags"><span class="tag"><!--__stack__--></span><span class="tag"><!--__difficulty__--></span></div></header>
<section class="checks"><h2>{{task_page.checks}}</h2><ul><!--__checks__--></ul></section>
<section><h2>{{task_page.solutions}}</h2><div class="solutions"><!--__solutions__--></div></section>
<!--__heldout__-->
<section><h2>{{task_page.grid}}</h2><p class="grid-note">{{task_page.grid_note}}</p><!--__final_grid__--><details class="naive-tests"><summary>{{task_page.naive_grid}}</summary><!--__naive_grid__--></details></section>
<section><details class="ticket" open><summary><h2>{{task_page.ticket}}</h2></summary><div class="ticket-body"><!--__ticket__--></div></details></section>
<section class="sources"><h2>{{task_page.source}}</h2><div class="source-links"><!--__sources__--></div></section>
<nav class="task-pagination" aria-label="{{task_page.navigation}}"><!--__navigation__--></nav>
</main></body></html>
